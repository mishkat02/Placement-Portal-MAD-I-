<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f2f5; 
            font-family: Arial, sans-serif;
            margin: 0;
            
            display: flex;
            justify-content: center; 
            align-items: center;     
            height: 120vh;           
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: lighter;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; 
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <form action="{{ url_for('edit_student', username=username) }}" method="POST">
            <h1>Edit Profile</h1>
            
            <label for="Username">Username:</label>
            <input type="text" name="Username" id="username" placeholder="Username" value="{{username}}" readonly>

            <label for="Email">Email:</label>
            <input type="email" name="Email" id="email" placeholder="Email" value="{{user.email}}" readonly>

            <label for="Password">Password:</label>
            <input type="password" name="Password" id="password" placeholder="Password" value="{{user.password}}" readonly>

            <label for="Student_name">Full Name:</label>
            <input type="text" name="Student_name" id="student_name" placeholder="Full Name" value="{{student.student_name if student.student_name else''}}" required>

            <label for="Skills">Skills:</label>
            <input type="text" name="Skills" id="skills" placeholder="Skills" value="{{student.skills if student.skills else ''}}" required>

            <label for="Resume">Resume:</label>
            <input type="text" name="Resume" id="resume" placeholder="Resume" value="{{student.resume if student.resume else ''}}" required>

            <label for="contact_info ">Contact Number:</label>
            <input type="text" name="Contact_info" id="contact_info" placeholder="Contact Number" value="{{student.contact_info if student.contact_info else ''}}" required>

            <button type="submit">Submit</button>
        </form> 
    </div>

</body>
</html>
